<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="forgeBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="steel" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Deep navy emblem background -->
  <rect width="512" height="512" rx="112" fill="#0B1220"/>

  <!-- Outer forged-steel frame -->
  <path
    d="M256 52 L420 147 L420 336 L256 460 L92 336 L92 147 Z"
    fill="none"
    stroke="#334155"
    stroke-width="12"
    stroke-linejoin="round"
  />

  <!-- Main angular forge symbol -->
  <path
    d="M151 148 L320 148 L365 193 L365 231 L315 231 L294 209 L202 209 L202 282 L258 282 L258 333 L151 333 Z"
    fill="url(#steel)"
  />

  <!-- Electric-blue forward arrow -->
  <path
    d="M235 260 L326 260 L326 229 L383 285 L326 341 L326 310 L235 310 Z"
    fill="url(#forgeBlue)"
  />

  <!-- Forged spark -->
  <path
    d="M365 126 L379 158 L411 172 L379 186 L365 218 L351 186 L319 172 L351 158 Z"
    fill="#60A5FA"
  />

  <!-- Precision accent -->
  <path
    d="M113 361 L154 385"
    fill="none"
    stroke="#3B82F6"
    stroke-width="10"
    stroke-linecap="round"
  />
</svg>